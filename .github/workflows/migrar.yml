
name: Migrar banco D1

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'

jobs:
  aplicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Aplicar migracoes no D1 remoto
        run: npx --yes wrangler d1 migrations apply avaliacao-notas --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
